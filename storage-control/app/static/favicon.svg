<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradient for the main drive body -->
    <linearGradient id="driveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for the drive top -->
    <linearGradient id="topGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd3fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for activity LED -->
    <radialGradient id="ledGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </radialGradient>
    
    <!-- Glow filter for LED -->
    <filter id="ledGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Subtle shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle (subtle) -->
  <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Hard drive body (main chassis) -->
  <rect x="15" y="35" width="70" height="40" rx="6" ry="6" 
        fill="url(#driveGradient)" filter="url(#dropShadow)"/>
  
  <!-- Drive top cover -->
  <path d="M15 35 L11 28 L89 28 L85 35 Z" fill="url(#topGradient)" filter="url(#dropShadow)"/>
  <path d="M15 35 L11 28 L89 28 L85 35 Z" fill="none" stroke="#0ea5e9" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Drive front bevel -->
  <rect x="15" y="35" width="70" height="4" rx="6" ry="0" fill="url(#topGradient)" opacity="0.6"/>
  
  <!-- Platters (internal disks) - visible through cutout -->
  <g clip-path="url(#driveClip)">
    <circle cx="50" cy="55" r="22" fill="#0c1a2a" stroke="#1e3a5f" stroke-width="1"/>
    <circle cx="50" cy="55" r="16" fill="#0f1f3a" stroke="#1e3a5f" stroke-width="0.5"/>
    <circle cx="50" cy="55" r="10" fill="#142842" stroke="#1e3a5f" stroke-width="0.5"/>
    <circle cx="50" cy="55" r="4" fill="#1e3a5f"/>
  </g>
  
  <!-- Actuator arm -->
  <path d="M50 33 L50 42 Q58 48 62 55" 
        stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"
        filter="url(#dropShadow)"/>
  <circle cx="62" cy="55" r="3" fill="#38bdf8" filter="url(#dropShadow)"/>
  
  <!-- Activity LED (pulsing green) -->
  <circle cx="78" cy="45" r="5" fill="url(#ledGradient)" filter="url(#ledGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="78" cy="45" r="3" fill="#86efac" opacity="0.8"/>
  
  <!-- SATA/Power connector hints -->
  <rect x="82" y="55" width="3" height="8" rx="1" fill="#334155"/>
  <rect x="82" y="65" width="3" height="6" rx="1" fill="#1e293b"/>
  
  <!-- Mounting holes -->
  <circle cx="20" cy="40" r="2.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="80" cy="40" r="2.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="20" cy="70" r="2.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="80" cy="70" r="2.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  
  <!-- Data flow lines (monitoring theme) -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M10 60 Q20 55 25 60 Q30 65 35 60">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M10 70 Q20 65 25 70 Q30 75 35 70" style="animation-delay: 0.5s;">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M65 60 Q75 55 80 60 Q85 65 90 60" style="animation-delay: 1s;">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M65 70 Q75 65 80 70 Q85 75 90 70" style="animation-delay: 1.5s;">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Clip path for platters -->
  <clipPath id="driveClip">
    <rect x="18" y="38" width="64" height="34" rx="4" ry="4"/>
  </clipPath>
</svg>